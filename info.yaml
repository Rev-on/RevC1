# Tiny Tapeout project information
project:
  title:        "RevC1"      # Project title
  author:       "Rev.on"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Rev.on's first MCU"      # One line description of what your project does
  language:     "custom" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     40000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "5x5"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  custom_gds: true
  top_module: "tt_um_rev_core"  # 必须和你的GDS文件名、顶层模块名完全一致
  
  # List your project's source files here. Source files must be in ./src and you must list each source file separately, one per line:
 

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
  io:
      - ["clk", "input"]
      - ["rst_n", "input"]
      - ["ena", "input"]
      - ["ui_in[7:0]", "input"]
      - ["uo_out[7:0]", "output"]
      - ["uio_in[7:0]", "input"]
      - ["uio_out[7:0]", "output"]
      - ["uio_oe[7:0]", "output"]
# Do not change!
yaml_version: 6
