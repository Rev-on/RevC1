project:
  title:        "RevC1"
  author:       "Rev.on"
  discord:      ""
  description:  "RISC-V MCU with UART, I2C, GPIO, PWM"
  language:     "Verilog"
  clock_hz:     40000000
  tiles:        "4x4"
  custom_gds:   true
  top_module:   "tt_um_rev_core"
  source_files: 
    - "src/tt_um_rev_core.v"          # 至少填这一个

# 引脚定义保持不变...
pinout:
  ui[0]: "uart rx input"
  ui[1]: ""
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  uo[0]: "uart tx output"
  uo[1]: "pwm output"
  uo[2]: "debug sel bit0"
  uo[3]: "debug sel bit1"
  uo[4]: "debug sel bit2"
  uo[5]: "debug data"
  uo[6]: ""
  uo[7]: ""

  uio[0]: "gpio pin 0"
  uio[1]: "gpio pin 1 / i2c scl"
  uio[2]: "gpio pin 2 / i2c sda"
  uio[3]: "gpio pin 3"
  uio[4]: "gpio pin 4"
  uio[5]: "gpio pin 5"
  uio[6]: "gpio pin 6"
  uio[7]: "gpio pin 7"

yaml_version: 6
