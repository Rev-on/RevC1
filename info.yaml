# Tiny Tapeout project information
project:
  title:        "RevC1"
  author:       "Rev.on"
  discord:      ""
  description:  "RevC1 RISC-V core with UART, I2C, PWM, GPIO"
  language:     "Verilog"
  clock_hz:     40000000
  tiles:        "5x5"
  custom_gds:   true
  top_module:   "tt_um_rev_core"

# 【修改】根据顶层模块实际连接来定义
pinout:
  # 输入引脚 ui_in (8个)
  ui[0]: "uart_rx"              # RISC-V UART接收输入
  ui[1]: ""                    
  ui[2]: ""                    
  ui[3]: ""                    
  ui[4]: ""                    
  ui[5]: ""                    
  ui[6]: ""                    
  ui[7]: ""                    

  # 输出引脚 uo_out (8个)
  uo[0]: "uart_tx"              # UART发送输出
  uo[1]: "pwm_out"              # PWM输出  
  uo[2]: "debug_sel[0]"         # 调试选择位0
  uo[3]: "debug_sel[1]"         # 调试选择位1
  uo[4]: "debug_sel[2]"         # 调试选择位2
  uo[5]: "debug_data"           # 调试数据输出
  uo[6]: ""                     
  uo[7]: ""                     

  # 双向引脚 uio (使用 uio_in, uio_out, uio_oe)
  uio[0]: "gpio[0]"             # GPIO 0
  uio[1]: "gpio[1] / i2c_scl"   # GPIO 1 或 I2C时钟
  uio[2]: "gpio[2] / i2c_sda"   # GPIO 2 或 I2C数据
  uio[3]: "gpio[3]"             # GPIO 3
  uio[4]: "gpio[4]"             # GPIO 4
  uio[5]: "gpio[5]"             # GPIO 5
  uio[6]: "gpio[6]"             # GPIO 6
  uio[7]: "gpio[7]"             # GPIO 7

yaml_version: 6
