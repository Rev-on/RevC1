# Tiny Tapeout project information
project:
  title:        "RevC1"      # Project title
  author:       "Rev.on"      # Your name
  discord:      ""      # Your discord username (optional)
  description:  "Rev.on's first MCU - a compact RISC-V core"      # One line description
  language:     "Verilog"     # 改回 Verilog，custom 可能会报错

  clock_hz:     40000000       # Clock frequency in Hz

  # How many tiles your design occupies?
  tiles: "5x5"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # 【关键】因为你已经有 GDS，必须设置为 true
  # 这样 GitHub Actions 会跳过自动布局布线，直接使用你提供的 GDS 文件
  custom_gds: true

  # 【关键】你的顶层模块名必须以 tt_um_ 开头
  # 你写的是 "tt_um_rev_core"，这个没问题，但必须和你的 GDS 文件名中的顶层模块名完全一致
  top_module: "tt_um_rev_core"

  # 【关键】因为你用了 custom_gds: true，source_files 必须留空或注释掉！
  # 不需要在这里列任何 Verilog 文件，因为你是直接提供版图
  # source_files: []
  # 或者直接不写这个字段

# The pinout of your project. DO NOT delete or add any pins.
# 注意：Tiny Tapeout 官方要求的是这种格式，不是你之前写的那种 [["clk", "input"]] 格式
pinout:
  # Inputs (8个)
  ui[0]: "clk"
  ui[1]: "rst_n"
  ui[2]: "ena"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs (8个)
  uo[0]: "status_0"
  uo[1]: "status_1"
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins (8个) - 如果没用就留空
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
